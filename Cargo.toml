[workspace]
resolver = "2"
members = [
    "crates/blazers-core",
    "crates/blazers-kv",
    "crates/blazers-server",
    "crates/blazers-mcp",
    "crates/blazers",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/hieudoanm/blazers"

[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
deadpool = { version = "=0.13.1", features = ["rt_tokio_1"] }
uuid = { version = "=1.29.2", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
reqwest = { version = "=0.13.5", features = ["json", "multipart"] }

rquickjs = "=0.14.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
