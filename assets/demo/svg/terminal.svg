  <text x="640" y="47" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#8a8a8a">blazers — zsh</text>
  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">blazers --version</tspan></text>  <text x="44" y="158" fill="#9ca3af">blazers 0.1.0</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">blazers serve --port 3000</tspan></text>  <text x="44" y="222" fill="#7dd3a8">serving on http://localhost:3000</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="254"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">blazers kv --port 6379</tspan></text>  <text x="44" y="286" fill="#9ca3af">kv&gt; set user:1 '{"name":"ada"}'</text>  <text x="44" y="318" fill="#9ca3af">OK</text>  <text x="44" y="350" fill="#9ca3af">kv&gt; get user:1</text>  <text x="44" y="382" fill="#c9a06a">{"name":"ada"}</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="414"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">blazers mcp serve</tspan></text>  <text x="44" y="446" fill="#9ca3af">MCP server on stdio — 12 tools</text>  </g></svg>
