name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust - check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust check
        run: cargo check --workspace --all-targets

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

  pages:
    name: Landing - GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: packages/landing/pnpm-lock.yaml

      - name: Install landing dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload landing artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  build:
    name: Build binary (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: blazers-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: blazers-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: blazers-windows-x86_64
            ext: .exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p blazers --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/blazers${{ matrix.ext }}" \
             "dist/${{ matrix.artifact }}${{ matrix.ext }}"
          cp README.md "dist/${{ matrix.artifact }}-README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: blazers-*
          merge-multiple: true

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: Blazers (latest)
          files: dist/*
          body_path: README.md
          generate_release_notes: true
