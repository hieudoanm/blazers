# Pre-commit hooks: format check + clippy + tests for the Rust workspace.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        files: '\.rs$|Cargo\.toml$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: '\.rs$|Cargo\.toml$'
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        files: '\.rs$|Cargo\.toml$'
        pass_filenames: false
